; modified https://github.com/gh0stzk/dotfiles

[module/bi]
type                        = custom/text
content                     = "%{T2}%{T-}"
content-foreground          = ${color.mb}
content-background          = ${color.bg}

## bylo mb bg

[module/bd]
type                        = custom/text
content                     = "%{T2}%{T-}"
content-foreground          = ${color.mb}
content-background          = ${color.bg}

######################################################
[module/tray]
type = internal/tray
tray-size = 16
tray-spacing = 8px
tray-background = ${color.bg}

#####################################################

[module/date]
type = internal/date

interval = 1.0

time = %H:%M
format-background = ${color.mb}
format-foreground = ${color.fg}
date-alt = " %A, %d %B %Y"

format = <label>
format-prefix = "󰃰"
format-prefix-background = ${color.mb}
format-prefix-foreground = ${color.purple}

label = %date% %time%

######################################################
######################################################

[module/wired-network]
type = internal/network
interface = net0

interval = 3.0
unknown-as-up = true

format-connected = <label-connected>
format-connected-prefix = "󰈀"
format-connected-background = ${color.mb}
format-connected-foreground = ${color.green}

speed-unit = ""
#label-connected = " %netspeed%"
label-connected = " %local_ip%"
label-connected-background = ${color.mb}
label-connected-foreground = ${color.fg}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰈀"

format-disconnected-background = ${color.mb}
format-disconnected-foreground = ${color.red}

label-disconnected = " not connected"
label-disconnected-foreground = ${color.red}

######################################################

[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = false
interval = 2

format-volume = <ramp-volume><label-volume>
format-volume-prefix = " "
format-volume-background = ${color.mb}
format-volume-foreground = ${color.purple}

label-volume = " %percentage%"
label-volume-background = ${color.mb}
label-volume-foreground = ${color.fg}

format-muted = <label-muted>
format-muted-prefix = " 󰝟"
format-muted-foreground = ${color.red}
format-muted-background = ${color.mb}
label-muted = " Muted"
label-muted-foreground = ${color.red}
label-muted-background = ${color.mb}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 3

click-right = pavucontrol

######################################################

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false


format = <label-state>

label-focused = 󰮯
label-focused-background = ${color.mb}
label-focused-padding = 6px
label-focused-foreground = ${color.yellow}

label-occupied = 󰊠
label-occupied-padding = 6px
label-occupied-background = ${color.mb}
label-occupied-foreground= ${color.blue}

label-urgent = %icon%
label-urgent-padding = 0

label-empty = 
label-empty-foreground = ${color.purple}
label-empty-padding = 6px
label-empty-background = ${color.mb}

######################################################

[module/launcher]
type = custom/text

format = 󰣇
#content = 󰣇
format-foreground = ${color.blue-arch}
format-padding = 6px
format-font = 3
#bylo 4

click-left = ~/.config/rofi/launchers/type-2/launcher.sh

######################################################

[module/sep]
type = custom/text
format = " "
format-foreground = ${color.bg}

######################################################

[module/blok2]
type = custom/text
format = " |"
format-foreground = ${color.fg}
format-background = ${color.bg}

######################################################

[module/blok]
type = custom/text
format = " | "
format-foreground = ${color.fg}
format-background = ${color.bg}

######################################################

[module/dots]
type = custom/text
format = " 󰇙 "
format-foreground = ${color.purple}

######################################################

[module/powermenu]
type = custom/text

format = "⏻"
format-background = ${color.mb}
format-foreground = ${color.red}

click-left = ~/.config/rofi/applets/bin/powermenu.sh
click-right = ~/.config/rofi/applets/bin/powermenu.sh

