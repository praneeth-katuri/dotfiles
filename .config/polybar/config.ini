; modified https://github.com/gh0stzk/dotfiles

[global/wm]

margin-bottom = 0
margin-top = 0

include-file = colors.ini
include-file = modules.ini

[bar/bar]

monitor = ${env:MONITOR:}

monitor-strict = false

override-redirect = false

bottom = false
fixed-center = true

width = 99%
height = 34

offset-x = 0.5%
offset-y = 1%

background = ${color.bg}
foreground = ${color.fg}

radius = 4.0

line-size = 2
line-color = ${color.blue}

border-size = 1px
border-color = ${color.bg}

padding = 1

module-margin-left = 0
module-margin-right = 0

; Text
font-0 = "JetBrainsMono Nerd Font:size=11;2"
; Icons
font-1 = "JetBrainsMono Nerd Font:size=12;3"
font-2 = "JetBrainsMono Nerd Font:size=15;4"

modules-left = launcher blok bspwm sep
modules-center =
modules-right = sep wired-network blok2 pulseaudio blok date blok tray blok powermenu sep

spacing = 0
separator =
dim-value = 1.0

;;locale = es_MX.UTF-8


wm-restack = bspwm
enable-ipc = true

cursor-click = pointer 
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = true
