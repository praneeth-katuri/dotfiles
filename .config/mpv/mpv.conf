# ───────────────────────────────
# 【 GLOBAL AUDIO SETTINGS 】 → Baseline for all playback
# ───────────────────────────────
audio-device=pipewire
audio-exclusive=no
audio-channels=stereo
volume-max=100
#audio-normalize=yes


vo=gpu-next
hwdec=auto-safe                 # Auto-enable HW decoding
gpu-api=vulkan

# ─── Baseline audio processing (applies everywhere) ───
af=lavfi=[acompressor=threshold=-20dB:ratio=2:attack=10:release=100]  # Gentle dynamic range control
af-add=lavfi=[equalizer=f=2000:width_type=h:width=1000:g=2]           # Mild vocal presence boost


# ─── Video Quality Defaults ───
profile=gpu-hq                  # Baseline HQ settings
deband=yes                      # Global deband (override per profile)
scale=ewa_lanczos               # Balanced scaling
cscale=bilinear                 # Lightweight chroma
dscale=mitchell                 # Quality downscaling

# ─── HDR→SDR Tone Mapping ───
tone-mapping=bt.2446a           # Accurate SDR conversion
target-colorspace-hint=yes

# ─── Performance ───
vd-lavc-dr=yes                  # Direct rendering (faster)
opengl-pbo=yes                  # Faster texture uploads
interpolation=no                # HARD-DISABLED globally

# ───────────────────────────────
#  [ SPECIALIZED PROFILES ]
# ───────────────────────────────

# PROFILE 1: VOICE CLARITY (Dialog Focus)

# PROFILE 2: MOVIE / WEB SERIES MODE
[movie]
profile-desc="Movie: Immersive"
deband-grain=6            # Simulate film grain
scale=spline36            # Natural film-like scaling
cscale=spline36
glsl-shaders=""           # Explicitly disable shaders

# Replace global AF with cinematic effects
af=lavfi=[bass=g=4:f=80, aexciter=amount=5:drive=2]  # Bass + harmonic excitement
af-add=lavfi=[dynaudnorm=f=150:g=15:r=0.1]           # Explosion normalization

[movie-clearvoice]
profile-desc="Voice: Crystal Clear"
# Override global AF with aggressive vocal boost
af=lavfi=[equalizer=f=300:g=-1, equalizer=f=1000:g=3, equalizer=f=4000:g=2]
af-add=lavfi=[acompressor=threshold=-30dB:ratio=3:makeup=4]  # Compress whispers

# PROFILE 3: ANIME MODE (Old & New)
[anime]
profile-desc="Anime: Vibrant"
deband=no                 # Preserve original banding
cscale=nearest            # Sharp pixel art scaling
dscale=nearest            # Prevent blurring on downscale
scale=ewa_lanczossharp    # Only for upscaling
# Brighten highs (vocal chirp) + compression
af=lavfi=[equalizer=f=8000:width_type=h:width=4000:g=3]
af-add=lavfi=[acompressor=threshold=-25dB:ratio=2.5:attack=50:release=200]

[anime_60fps]
profile-desc="Anime: Native 60fps"
profile=anime                   # Inherits ALL anime settings
tscale=catmull_rom              # Optimized motion
scale=ewa_lanczos               # Slightly faster than lanczossharp

# PROFILE 4: MOVIE 60FPS (Native)
[movie_60fps]
profile-desc="Movie: Native 60fps"
profile=movie                   # Inherits ALL movie settings
tscale=mitchell                 # Natural motion
